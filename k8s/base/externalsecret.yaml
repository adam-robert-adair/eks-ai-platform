apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: langgraph
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: langgraph-runtime
  namespace: langgraph
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager
  target:
    name: langgraph-runtime
    creationPolicy: Owner
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: /eks-ai-platform/langgraph
        property: openai_api_key
    - secretKey: model_name
      remoteRef:
        key: /eks-ai-platform/langgraph
        property: model_name
