apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph
  namespace: langgraph
  labels:
    app: langgraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: langgraph
  template:
    metadata:
      labels:
        app: langgraph
    spec:
      serviceAccountName: langgraph
      containers:
        - name: langgraph
          image: LANGGRAPH_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: langgraph-runtime
                  key: model_name
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langgraph-runtime
                  key: openai_api_key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
